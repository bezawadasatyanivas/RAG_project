[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SatyanivasBezawada", email = "bezawadasatyanivas@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "gradio<6",
    "jupyterlab>=4.6.6",
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.5",
    "langchain-google-genai>=4.5.3",
    "langchain-huggingface>=1.3.0",
    "langchain-text-splitters>=1.2.0",
    "numpy<2",
    "onnxruntime<1.20",
    "openai>=3.59.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers==3.3.1",
    "torch==2.2.2",
    "transformers<5",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
