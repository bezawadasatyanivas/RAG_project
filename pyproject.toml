[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SatyanivasBezawada", email = "bezawadasatyanivas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.32.0",
    "jupyterlab>=4.6.6",
    "onnxruntime<1.20",
    "openai>=3.59.0",
    "pypdf>=7.1.1",
